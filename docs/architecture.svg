<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A GitHub push triggers Jenkins, which builds a JAR, builds and pushes a Docker image, splits to either DockerHub or ECR, merges, splits again to deploy via either SSH or SSM, then merges into the app EC2 instance.</desc>
