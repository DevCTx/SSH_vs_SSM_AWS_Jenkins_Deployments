jenkins:

  # Controller orchestrates only, never builds. Jobs run on separate agents.
  numExecutors: 0

  # Authentication via DEFINED ADMIN user only (No LDAP or SSO)
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  # And this user will get ALL ADMIN privileges
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_USER}"
            permissions:
              - "Overall/Administer"

  # Will use a docker cloud with specific connected agents needed for this config
  clouds:
    - docker:
        name: "docker-cloud"
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"

        templates:

          - labelString: "base-agent"
            dockerTemplateBase: { image: "jenkins-base-agent" }
            remoteFs: "/home/jenkins"
            connector: { attach: {} }
            pullStrategy: PULL_NEVER
            instanceCapStr: "2"

          - labelString: "maven-agent"
            dockerTemplateBase: { image: "jenkins-maven-agent" }
            remoteFs: "/home/jenkins"
            connector: { attach: {} }
            pullStrategy: PULL_NEVER
            instanceCapStr: "2"

          # docker-aws-agent, not docker-lite: SSM deploy needs the AWS CLI
          # even though the registry itself is DockerHub.
          - labelString: "docker-aws-agent"
            dockerTemplateBase:
              image: "jenkins-docker-aws-agent"
              mounts:
                - "type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock"
              extraGroups: [ "${DOCKER_GID}" ]
            remoteFs: "/home/jenkins"
            connector: { attach: {} }
            pullStrategy: PULL_NEVER
            instanceCapStr: "2"

credentials:
  system:
    domainCredentials:
      - credentials:
          # GitHub checkout + webhook trust
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "${GITHUB_OWNER}"
              password: "${GITHUB_JENKINS_TOKEN}"

          # DockerHub push (build stage)
          - string: { scope: GLOBAL, id: "dockerhub-username", secret: "${DOCKER_USERNAME}" }
          - string: { scope: GLOBAL, id: "dockerhub-pat",      secret: "${DOCKERHUB_PAT}" }

          # No AWS credential here: Jenkins runs ON AWS, its instance IAM role
          # (SSM_INSTANCE_ROLE, attached by aws_ec2_jenkins_install.sh) already
          # grants "aws ssm send-command" without any Jenkins credential.

          # SSM deploy target (deploy stage)
          - string: { scope: GLOBAL, id: "app-ec2-id", secret: "${APP_EC2_ID}" }

jobs:
  # AGENT TESTINGS: allows to check every agent declared for this configuration into Jenkins.
  - script: >
      pipelineJob('agent-testings') {
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent none
                stages {
                  stage('Test Base') {
                    agent { label 'base-agent' }
                    steps { sh 'java -version && git --version' }
                  }
                  stage('Test Maven') {
                    agent { label 'maven-agent' }
                    steps { sh 'java -version && mvn -v' }
                  }
                  stage('Test Docker') {
                    agent { label 'docker-aws-agent' }
                    steps { sh 'docker --version && aws --version' }
                  }
                }
              }
            '''.stripIndent())
          }
        }
      }

  # DOCKERHUB-SSM-EC2 : Pipeline using the DOCKERHUB registry and the protocol SSM to deploy on AWS EC2
  - script: >
      pipelineJob('dockerhub-ssm-ec2') {
        triggers {
          githubPush()
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url("https://github.com/" + System.getenv('REPO') + ".git")
                  credentials('github-token')
                }
                branch('*/main')
              }
            }
            scriptPath('dockerhub_ssm_ec2/Jenkinsfile')
          }
        }
      }

unclassified:
  location:
    url: "http://${JENKINS_INGRESS_IP}:8080/"